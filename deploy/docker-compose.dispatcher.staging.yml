name: alicdt-dispatcher-staging

# Optional grey gateway. It uses different host ports so it cannot steal the
# production entry while protocol and quota-routing checks are in progress.
services:
  dispatcher:
    build:
      context: ..
      dockerfile: Dockerfile.dispatcher
    image: alicdt-dispatcher:staging
    container_name: alicdt-dispatcher-staging
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 15s
    ports:
      - "${CDT_DISPATCH_STAGING_PUBLIC_PORT:-18443}:8443/tcp"
      - "${CDT_DISPATCH_STAGING_PUBLIC_PORT:-18443}:8443/udp"
      - "127.0.0.1:${CDT_DISPATCH_STAGING_HEALTH_PORT:-19091}:9091/tcp"
    environment:
      CDT_DISPATCH_CONTROLLER_URL: ${CDT_DISPATCH_CONTROLLER_URL:?set CDT_DISPATCH_CONTROLLER_URL}
      CDT_DISPATCH_POOL_ID: ${CDT_DISPATCH_POOL_ID:?set CDT_DISPATCH_POOL_ID}
      CDT_DISPATCH_TOKEN: ${CDT_DISPATCH_TOKEN:?set CDT_DISPATCH_TOKEN}
      CDT_DISPATCH_LISTEN: :8443
      CDT_DISPATCH_NETWORK: ${CDT_DISPATCH_NETWORK:-tcp+udp}
      CDT_DISPATCH_HEALTH_LISTEN: 0.0.0.0:9091
      CDT_DISPATCH_POLL_INTERVAL: ${CDT_DISPATCH_POLL_INTERVAL:-10s}
      CDT_DISPATCH_STALE_AFTER: ${CDT_DISPATCH_STALE_AFTER:-90s}
      CDT_DISPATCH_REQUEST_TIMEOUT: ${CDT_DISPATCH_REQUEST_TIMEOUT:-10s}
      CDT_DISPATCH_MAX_SNAPSHOT_AGE: ${CDT_DISPATCH_MAX_SNAPSHOT_AGE:-90s}
      TZ: Asia/Shanghai
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/readyz"]
      interval: 10s
      timeout: 3s
      retries: 4
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
