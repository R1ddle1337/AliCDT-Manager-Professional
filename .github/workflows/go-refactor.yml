name: Go Relay Platform CI

on:
  push:
    branches: [main, refactor/go-relay-platform]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true
      - name: Go tests
        run: go test -race ./...
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Build controller and agent
        run: |
          CGO_ENABLED=0 go build -o /tmp/alicdt-controller ./cmd/controller
          CGO_ENABLED=0 go build -o /tmp/cdt-relay-agent ./cmd/relay-agent
          CGO_ENABLED=0 go build -o /tmp/cdt-dispatcher ./cmd/dispatcher
      - name: Validate deployment assets
        run: |
          sh -n scripts/install-agent.sh scripts/upgrade-agent.sh scripts/cdt-sing-box-log-cleanup.sh
          bash -n scripts/install-dispatcher.sh deploy/cdt-dispatcher-update.sh deploy/alicdt-manager-update.sh deploy/alicdt-agent-upgrade.sh
          CDT_ADMIN_TOKEN=ci-admin CDT_BOOTSTRAP_ENROLL_TOKEN=ci-enroll \
            docker compose -f deploy/docker-compose.go.yml config >/dev/null
          CDT_ADMIN_TOKEN=ci-admin \
            docker compose -f deploy/docker-compose.go.production.yml config >/dev/null
          CDT_DISPATCH_CONTROLLER_URL=https://example.invalid CDT_DISPATCH_POOL_ID=pool CDT_DISPATCH_TOKEN=ci-token \
            docker compose -f deploy/docker-compose.dispatcher.yml config >/dev/null
